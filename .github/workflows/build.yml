name: engine-apk

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source ref of CodeAbhi826/nfsmwrecomp-mali to build"
        required: true
        default: dev
      cmake_version:
        description: "Android SDK CMake package"
        required: true
        default: "3.31.6"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout private harness (game XEX)
        uses: actions/checkout@v4
        with:
          repository: CodeAbhi826/nfsmw-engine-builder
          ssh-key: ${{ secrets.NFSMW_XEX_DEPLOY_KEY }}
          path: harness

      - name: Clone public source (${{ inputs.ref }})
        run: |
          if git ls-remote --exit-code --heads https://github.com/CodeAbhi826/nfsmwrecomp-mali.git "${{ inputs.ref }}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${{ inputs.ref }}" https://github.com/CodeAbhi826/nfsmwrecomp-mali.git src
          else
            git clone https://github.com/CodeAbhi826/nfsmwrecomp-mali.git src
            git -C src checkout "${{ inputs.ref }}"
          fi
          git -C src log --oneline -1

      - name: Install game executable (PAL Spanish reference)
        run: |
          mkdir -p src/assets/game_root
          cp harness/game/default.xex src/assets/game_root/default.xex
          sha256sum src/assets/game_root/default.xex
          test "$(sha256sum src/assets/game_root/default.xex | cut -d' ' -f1)" = "aad15fc218d034de3131f746e0b763dd8049a40dd676efc87667fcaf4fc72694"

      - name: Fetch ReXGlue third-party sources
        working-directory: src
        run: python3 tools/fetch_thirdparty.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (runner's preinstalled copy)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;${{ inputs.cmake_version }}"
          ls "$ANDROID_HOME/ndk"

      - name: Host compiler check
        run: |
          if ! command -v clang >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi
          cmake --version
          clang++ --version | head -1
          ninja --version

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb-dev libxcb1-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev

      - name: Build host rexglue code generator
        working-directory: src
        run: |
          cmake -S sdk -B out/host -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-mssse3" -DCMAKE_CXX_FLAGS="-mssse3 -D__cpp_lib_expected=202202L"
          cmake --build out/host --target rexglue -j"$(nproc)"

      - name: Generate recompiled game code
        working-directory: src
        run: |
          PYTHON=python3 REXGLUE="$PWD/out/host/rexglue" bash tools/codegen.sh app
          test -f app/generated/sources.cmake
          du -sh app/generated/default app/src/copias_literales

      - name: Enable Android native build
        run: python3 harness/scripts/enable_native_build.py src/android/app/build.gradle "${{ inputs.cmake_version }}"

      - name: Build APK
        working-directory: src/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          find src/android/app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          ls -la out
          sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nfsmw-mali-engine-apk-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
