name: engine-apk

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source ref of CodeAbhi826/nfsmwrecomp-mali to build"
        required: true
        default: dev
      cmake_version:
        description: "Android SDK CMake package"
        required: true
        default: "3.31.6"
      version_code:
        description: "versionCode for the APK (must grow for every release)"
        required: true
        default: "100"
      version_name:
        description: "versionName for the APK"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout private harness (game XEX)
        uses: actions/checkout@v4
        with:
          repository: CodeAbhi826/nfsmw-engine-builder
          ssh-key: ${{ secrets.NFSMW_XEX_DEPLOY_KEY }}
          path: harness

      - name: Clone public source (${{ inputs.ref }})
        run: |
          if git ls-remote --exit-code --heads https://github.com/CodeAbhi826/nfsmwrecomp-mali.git "${{ inputs.ref }}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${{ inputs.ref }}" https://github.com/CodeAbhi826/nfsmwrecomp-mali.git src
          else
            git clone https://github.com/CodeAbhi826/nfsmwrecomp-mali.git src
            git -C src checkout "${{ inputs.ref }}"
          fi
          git -C src log --oneline -1

      - name: Install game executable (PAL Spanish reference)
        run: |
          mkdir -p src/assets/game_root
          cp harness/game/default.xex src/assets/game_root/default.xex
          sha256sum src/assets/game_root/default.xex
          test "$(sha256sum src/assets/game_root/default.xex | cut -d' ' -f1)" = "aad15fc218d034de3131f746e0b763dd8049a40dd676efc87667fcaf4fc72694"

      - name: Fetch ReXGlue third-party sources
        working-directory: src
        run: python3 tools/fetch_thirdparty.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (runner's preinstalled copy)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;${{ inputs.cmake_version }}"
          ls "$ANDROID_HOME/ndk"

      - name: Host compiler check
        run: |
          if ! command -v clang >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi
          cmake --version
          clang++ --version | head -1
          ninja --version

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb-dev libxcb1-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev

      - name: Build host rexglue code generator
        working-directory: src
        run: |
          cmake -S sdk -B out/host -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-mssse3" -DCMAKE_CXX_FLAGS="-mssse3 -D__cpp_lib_expected=202202L"
          cmake --build out/host --target rexglue -j"$(nproc)"

      - name: Generate recompiled game code
        working-directory: src
        run: |
          REXGLUE_BIN="$(find "$PWD/out" "$PWD/sdk/out" -type f -name rexglue -perm -u+x 2>/dev/null | head -1)"
          test -n "$REXGLUE_BIN"
          echo "REXGLUE=$REXGLUE_BIN"
          PYTHON=python3 REXGLUE="$REXGLUE_BIN" bash tools/codegen.sh app || {
            echo '--- app/codegen.log ---'
            cat app/codegen.log || true
            exit 1
          }
          test -f app/generated/default/sources.cmake
          du -sh app/generated/default app/src/copias_literales

      - name: Enable Android native build
        run: python3 harness/scripts/enable_native_build.py src/android/app/build.gradle "${{ inputs.cmake_version }}"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.NFSMW_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "NFSMW_KEYSTORE_B64 is empty"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nfsmw-release.jks"
          test -s "$RUNNER_TEMP/nfsmw-release.jks"
          {
            echo "NFSMW_KEYSTORE=$RUNNER_TEMP/nfsmw-release.jks"
            echo "NFSMW_KEYSTORE_PASSWORD=${{ secrets.NFSMW_KEYSTORE_PASSWORD }}"
            echo "NFSMW_KEY_ALIAS=${{ secrets.NFSMW_KEY_ALIAS }}"
            echo "NFSMW_KEY_PASSWORD=${{ secrets.NFSMW_KEY_PASSWORD }}"
            echo "NFSMW_VERSION_CODE=${{ inputs.version_code }}"
            echo "NFSMW_VERSION_NAME=${{ inputs.version_name }}"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: src/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature (must be the release key, not the debug key)
        run: |
          APK="$(find src/android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$APK"
          BT=/usr/local/lib/android/sdk/build-tools/35.0.0
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -qi "Android Debug" /tmp/certs.txt; then
            echo "APK is signed with the debug key"; exit 1
          fi
          # apksigner prints the digest lowercase and without separators; normalise both sides.
          DIGEST=$(grep -i "SHA-256 digest" /tmp/certs.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          EXPECTED="78f58c80107a94ccb19de1f68aa99ab0728969c657d412fae0477d80a539146a"
          echo "signer sha256: $DIGEST"
          test "$DIGEST" = "$EXPECTED" || { echo "Unexpected signing certificate"; exit 1; }

      - name: Collect artifacts
        run: |
          mkdir -p out
          find src/android/app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          ls -la out
          sha256sum out/*.apk
          echo "versionCode=${{ inputs.version_code }} versionName=${{ inputs.version_name }}" > out/VERSION.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nfsmw-mali-engine-apk-${{ inputs.version_name }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 1
